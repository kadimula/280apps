name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history for the manifest-shape publish-skew guard

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fails when the CLI's wire-manifest shape changed without a version bump, so
      # the published CLI can never lag the deployed backend gate again (root cause
      # of the two80@0.4.6 activation-gate skew).
      - run: node packages/cli/scripts/check-manifest-shape-bump.mjs

      - run: pnpm install --frozen-lockfile

      # Workspace consumers resolve built dist, so build precedes test.
      - run: pnpm build

      # backend's Postgres suites (packages/backend/test/pg.ts) are fatal, not
      # skipped, when CI is truthy and TEST_DATABASE_URL is unset. This pass wires
      # no database, so CI is cleared here to run the fake-store suites and skip
      # the Postgres ones; provisioning TEST_DATABASE_URL is a deliberate follow-up.
      - run: pnpm test
        env:
          CI: ''

      - run: pnpm typecheck

      - run: pnpm lint
