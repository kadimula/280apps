<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>280 Static Sample</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --fg: #e7ecf3;
        --muted: #9aa4b2;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        padding: 2.5rem;
        text-align: center;
      }
      h1 { margin: 0 0 0.5rem; font-size: 2rem; }
      p { margin: 0.25rem 0; color: var(--muted); }
      .badge {
        display: inline-block;
        margin-bottom: 1.5rem;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Sample App 1</span>
      <h1>Hello from 280</h1>
      <p>This is a single-file static app.</p>
      <p>Deployed with <code>280 push</code>.</p>
    </main>
    <!-- redeploy to refresh app worker bundle -->
  </body>
</html>
